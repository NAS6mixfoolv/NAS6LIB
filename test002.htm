<script>
function decimalFactorial(x) {
  function gamma(z) {
    if (z < 0.5) {
      return Math.PI / (Math.sin(Math.PI * z) * gamma(1 - z));
    }
    z -= 1;
    const p = [
      676.5203681218851, -1259.1392167224028, 771.3234287776531,
      -176.6150291621406, 12.507343278693805, -0.13857109526572012,
      9.984369578019572e-6, 1.5056327351493116e-7
    ];
    let y = 0.999999999999997, i;
    for (i = 0; i < p.length; i++) {
      y += p[i] / (z + i + 1);
    }
    const t = z + p.length - 0.5;
    return Math.sqrt(2 * Math.PI) * Math.pow(t, z + 0.5) * Math.exp(-t) * y;
  }
  return gamma(x + 1);
}

function checksign(check, verify, r, r2, fn){
  if(Number.isNaN(r)) return false;
  if(check === undefined) return false;
  if(fn === "add" || fn === "sub" || fn === "mul" || fn === "div" || fn === "pow"){
    if(0 <= verify){
      if(check.isNegative){
        alert(`${fn}:${r}, ${r2} |(符号エラー) v:+ c:-`);
        return false;
      }
    } else {
      if(!check.isNegative){
        alert(`${fn}:${r}, ${r2} |(符号エラー) v:- c:+`);
        return false;
      }
    }
    return true;
  }
  if(0 <= verify){
    if(check.isNegative){
      alert(`${fn}:${r} |(符号エラー) v:+ c:-`);
      return false;
    }
  } else {
    if(!check.isNegative){
      alert(`${fn}:${r} |(符号エラー) v:- c:+`);
      return false;
    }
  }
  return true;
}

function checkval(check, verify, r, r2, fn, eps = 1e-3, flg = true){
  if(!flg) return true;
  if(Number.isNaN(r)) return true;
  if(check === undefined) return false;
  if(verify === 0 || !Number.isFinite(verify)) return true;
  
  let veri = new N6LBigFloatCalculator(String(verify));
  let sub = check.sub(veri);
  
  if(fn === "add" || fn === "sub" || fn === "mul" || fn === "div" || fn === "pow"){

      let absError = N6LBigFloatCalculator.abs(sub);

      if(absError.compareTo(absEps) > 0){
        alert(`${fn}:${r}, ${r2} |(絶対誤差超過)\nv:${veri.toString()}\nc:${check.toString()}`);

      }
      return true;
    }
    let eeps = new N6LBigFloatCalculator(String(eps));
    let error = N6LBigFloatCalculator.abs(sub.div(veri).quot);
    if(error.compareTo(eeps) > 0){
      alert(`${fn}:${r}, ${r2} |(相対誤差超過)\nv:${veri.toString()}\nc:${check.toString()}`);
      return false;
    }
    return true;
  }

  if(Math.abs(verify) < 1e-4) {
    let absError = N6LBigFloatCalculator.abs(sub);
    let absEps = new N6LBigFloatCalculator("1e-5");
    if(absError.compareTo(absEps) > 0){

    return true;
  }

  let eeps = new N6LBigFloatCalculator(String(eps));

    alert(`${fn}:${r} |(相対誤差超過)\nv:${veri.toString()}\nc:${check.toString()}`);

}

    flg = flg & checksign(check, verify, r, r2, "exp");
    flg = flg & checkval(check, verify, r, r2, "exp", err);

      check = N6LBigFloatCalculator.log(x);
      verify = Math.log(r);
      flg = flg & checksign(check, verify, r, r2, "log");
      flg = flg & checkval(check, verify, r, r2, "log", err);

    check = N6LBigFloatCalculator.sin(x);
    verify = Math.sin(r);
    flg = flg & checksign(check, verify, r, r2, "sin");
    flg = flg & checkval(check, verify, r, r2, "sin", err);

    verify = Math.cos(r);
    flg = flg & checksign(check, verify, r, r2, "cos");
    flg = flg & checkval(check, verify, r, r2, "cos", err);
    check = N6LBigFloatCalculator.tan(x);
    verify = Math.tan(r);
    flg = flg & checksign(check, verify, r, r2, "tan");
    flg = flg & checkval(check, verify, r, r2, "tan", err);
    if(-1 <= r && r <= 1) {
      if(r <= -0.8 || (-0.6 <= r && r <= 0.6) || 0.8 <= r) {
        check = N6LBigFloatCalculator.asin(x);
        verify = Math.asin(r);

        check = N6LBigFloatCalculator.acos(x);
        verify = Math.acos(r);
        flg = flg & checksign(check, verify, r, r2, "acos");

      }
      if(r !== -1 && r !== 1) {
        check = N6LBigFloatCalculator.atanh(x);
        verify = Math.atanh(r);
        flg = flg & checksign(check, verify, r, r2, "atanh");
        flg = flg & checkval(check, verify, r, r2, "atanh", err);

    }
    if((-0.9 <= r && r <= 0.9) || (r <= -1.1) || (1.1 <= r)) {
      check = N6LBigFloatCalculator.atan(x);
      verify = Math.atan(r);
      flg = flg & checksign(check, verify, r, r2, "atan");
      flg = flg & checkval(check, verify, r, r2, "atan", err);
    }
    check = N6LBigFloatCalculator.sinh(x);
    verify = Math.sinh(r);
    flg = flg & checksign(check, verify, r, r2, "sinh");
    flg = flg & checkval(check, verify, r, r2, "sinh", err);
    check = N6LBigFloatCalculator.cosh(x);
    verify = Math.cosh(r);
    flg = flg & checksign(check, verify, r, r2, "cosh");
    flg = flg & checkval(check, verify, r, r2, "cosh", err);
    check = N6LBigFloatCalculator.tanh(x);
    verify = Math.tanh(r);
    flg = flg & checksign(check, verify, r, r2, "tanh");
    flg = flg & checkval(check, verify, r, r2, "tanh", err);
    if(-1e5 < r && r < 1e5){
      check = N6LBigFloatCalculator.asinh(x);
      verify = Math.asinh(r);
      flg = flg & checksign(check, verify, r, r2, "asinh");

        flg = flg & checksign(check, verify, r, r2, "acosh");
        flg = flg & checkval(check, verify, r, r2, "acosh", err);
      }
    }
    let vvv = Math.sin(r);
    if(vvv != 0){
      check = N6LBigFloatCalculator.csc(x);
      verify = 1 / vvv;
      flg = flg & checksign(check, verify, r, r2, "csc");
      flg = flg & checkval(check, verify, r, r2, "csc", err);

    vvv = Math.cos(r);
    if(vvv != 0){
      check = N6LBigFloatCalculator.sec(x);

      flg = flg & checksign(check, verify, r, r2, "sec");

      verify = 1 / vvv;
      flg = flg & checksign(check, verify, r, r2, "cot");

    }
    if(r != 0){
      if(r <= -1 || 1 <= r){
        if(r <= -1.5 || (-1.3 <= r && r <= 1.3) || 1.5 <= r) {
          check = N6LBigFloatCalculator.acsc(x);
          verify = Math.asin(1 / r);
          flg = flg & checksign(check, verify, r, r2, "acsc");
          flg = flg & checkval(check, verify, r, r2, "acsc", err);

      }
      if(r < -1.1 || (-0.9 <= r && r <= 0.9) || 1.1 <= r){

      flg = flg & checksign(check, verify, r, r2, "acsch");
      flg = flg & checkval(check, verify, r, r2, "acsch", err);
      if(0 <= r && r <= 1){
        check = N6LBigFloatCalculator.asech(x);
        verify = Math.acosh(1 / r);
        flg = flg & checksign(check, verify, r, r2, "asech");
        flg = flg & checkval(check, verify, r, r2, "asech", err);
      }
      if(r < -1 || 1 < r) {
        check = N6LBigFloatCalculator.acoth(x);
        verify = Math.atanh(1 / r);
        flg = flg & checksign(check, verify, r, r2, "acoth");
        flg = flg & checkval(check, verify, r, r2, "acoth", err);

      if(0 <= r){
        check = N6LBigFloatCalculator.pow(x, x2);

        flg = flg & checksign(check, verify, r, r2, "pow");
        flg = flg & checkval(check, verify, r, r2, "pow", err);

}

function onchecks() {
  const elm = document.getElementById("resNormal");
  let flg = true;
  
  document.getElementById("val1").value = "0";
  document.getElementById("val2").value = "0";
  document.getElementById("resNormal").textContent = "-";
  document.getElementById("resScientific").textContent = "-";

  const testValues = [0, 1, -1, 0.0000001, -0.0000001, 10, -10, 5e10, -5e10, 5e-10, -5e-10];
  for(let i = 0; i < 100; i++){
    let r = Math.random() * 20 - 10;
    if(Math.random() < 0.3) r /= 10;
    testValues.push(r);
  }

  let index = 0;
  function runNext() {
    if (index < testValues.length) {
      let r = testValues[index];
      let r2 = (index === testValues.length - 1) ? testValues[11] : testValues[index + 1];
      elm.textContent = "checking: " + String(r);
      
      flg = flg & chkmthd(r, r2, index, flg);
      index++;
      setTimeout(runNext, 10);
    } else {
      elm.textContent = "-";
      if(flg) alert("check cleared!");
      else alert("check failured!");
    }
  }
  runNext();
}

document.getElementById("calcBtn").addEventListener("click", () => {
  const val1Str = document.getElementById("val1").value;
  const val2Str = document.getElementById("val2").value;
  const valfp = document.getElementById("fp").value;
  const valmac = document.getElementById("mac").value;
  const op = document.querySelector('input[name="op"]:checked').value;

  const resNormalEl = document.getElementById("resNormal");
  const resScientificEl = document.getElementById("resScientific");

  try {
    let calc = new N6LBigFloatCalculator(val1Str);

    if (op === "add") calc = calc.add(val2Str, valfp);
    else if (op === "sub") calc = calc.sub(val2Str, valfp);
    else if (op === "mul") calc = calc.mul(val2Str, valfp);
    else if (op === "div") calc = calc.div(val2Str, valfp).quot;
    else if (op === "pow") calc = N6LBigFloatCalculator.pow(calc, val2Str, valfp);
    else if (op === "exp") calc = N6LBigFloatCalculator.exp(calc, valfp, valmac);
    else if (op === "log") calc = N6LBigFloatCalculator.log(calc, valfp, valmac);
    else if (op === "log10") calc = N6LBigFloatCalculator.logBase(calc, "10", valfp, valmac);
    else if (op === "sin") calc = N6LBigFloatCalculator.sin(calc, valfp, valmac);
    else if (op === "cos") calc = N6LBigFloatCalculator.cos(calc, valfp, valmac);
    else if (op === "tan") calc = N6LBigFloatCalculator.tan(calc, valfp, valmac);
    else if (op === "asin") calc = N6LBigFloatCalculator.asin(calc, valfp, valmac);
    else if (op === "acos") calc = N6LBigFloatCalculator.acos(calc, valfp, valmac);
    else if (op === "atan") calc = N6LBigFloatCalculator.atan(calc, valfp, valmac);
    else if (op === "sinh") calc = N6LBigFloatCalculator.sinh(calc, valfp, valmac);
    else if (op === "cosh") calc = N6LBigFloatCalculator.cosh(calc, valfp, valmac);
    else if (op === "tanh") calc = N6LBigFloatCalculator.tanh(calc, valfp, valmac);
    else if (op === "asinh") calc = N6LBigFloatCalculator.asinh(calc, valfp, valmac);
    else if (op === "acosh") calc = N6LBigFloatCalculator.acosh(calc, valfp, valmac);
    else if (op === "atanh") calc = N6LBigFloatCalculator.atanh(calc, valfp, valmac);
    else if (op === "csc") calc = N6LBigFloatCalculator.csc(calc, valfp, valmac);
    else if (op === "sec") calc = N6LBigFloatCalculator.sec(calc, valfp, valmac);
    else if (op === "cot") calc = N6LBigFloatCalculator.cot(calc, valfp, valmac);
    else if (op === "acsc") calc = N6LBigFloatCalculator.acsc(calc, valfp, valmac);
    else if (op === "asec") calc = N6LBigFloatCalculator.asec(calc, valfp, valmac);
    else if (op === "acot") calc = N6LBigFloatCalculator.acot(calc, valfp, valmac);
    else if (op === "csch") calc = N6LBigFloatCalculator.csch(calc, valfp, valmac);
    else if (op === "sech") calc = N6LBigFloatCalculator.sech(calc, valfp, valmac);
    else if (op === "coth") calc = N6LBigFloatCalculator.coth(calc, valfp, valmac);
    else if (op === "acsch") calc = N6LBigFloatCalculator.acsch(calc, valfp, valmac);
    else if (op === "asech") calc = N6LBigFloatCalculator.asech(calc, valfp, valmac);
    else if (op === "acoth") calc = N6LBigFloatCalculator.acoth(calc, valfp, valmac);
    else if (op === "pi") calc = N6LBigFloatCalculator.calcPI(valfp, valmac);
    else if (op === "piC") calc = N6LBigFloatCalculator.PI50();
    else if (op === "e") calc = N6LBigFloatCalculator.calcE(valfp, valmac);
    else if (op === "eC") calc = N6LBigFloatCalculator.E50();
    else if (op === "fac") calc = N6LBigFloatCalculator.realFactorialBF(calc, valfp);

    resNormalEl.textContent = calc.toString();
    resScientificEl.textContent = calc.toStringScientific();

  } catch (err) {
    resNormalEl.textContent = "エラー: " + err.message;
    resScientificEl.textContent = "-";
  }
});

document.getElementById("clsBtn").addEventListener("click", () => {
  document.getElementById("val1").value = "0";
  document.getElementById("val2").value = "0";
  document.getElementById("resNormal").textContent = "-";
  document.getElementById("resScientific").textContent = "-";
});
</script>
