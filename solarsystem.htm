.main-container {
    display: flex;

    align-items: flex-start;

}

/* 3. コントロール/入力エリアの修正 */
.controls-container {
    flex-grow: 1;
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    overflow-x: hidden;
}

.controls-container form {
    width: 100%;
    box-sizing: border-box;
}

.controls-container pre {
    white-space: pre-wrap;
    word-break: break-all;

}

/* 2. X3DコンテナとX3D要素の修正 */
.x3d-container {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
}

/* PC時の #x3dabs の基本サイズを500pxに固定 */
#x3dabs {
    width: 500px !important;
    height: 500px !important;
    max-width: 100%;
    border: 2px #000000 solid;
    background-image: url("./img/mimiback.png");
    background-size: cover;
    background-position: center;
}

/* X3DOM内部のcanvasや描画領域を親要素（#x3dabs）にしっかり追従させる */
#x3dabs canvas,
#x3dabs x3d-canvas {
    width: 100% !important;
    height: 100% !important;
}

/* X3DOMのデフォルトUIや全画面ボタンを非表示にする（canvasは除外） */
#x3dabs .x3d-ui,
.x3d_state_lightbox,
.x3d-fullscreen-button {
    display: none !important;
}

/* 4. モバイル（画面幅が狭い時）の調整 */
@media (max-width: 850px) {
    .main-container {
        flex-direction: column;
        align-items: flex-start;
        width: 100%;
        margin: 5px 0;
        padding: 0;
    }
    .x3d-container {
        flex: 1 1 100%;
        width: 100%;
    }
    
    /* スマホ時は画面幅いっぱいの正方形（最大500px）にする */
    #x3dabs {
        width: 100vw !important;
        height: 100vw !important;
        max-width: 500px !important;
        max-height: 500px !important;
        border-left: none;
        border-right: none;
        background-image: url("./img/mimiback.png");
        background-size: cover;
        background-position: center;
    }

    .progress-container {
        width: 100vw;
        max-width: none;
        border-left: none;
        border-right: none;
    }

    .progress-mover {
        animation-name: moveRightMobile;
    }
}

/* プログレスバー全体のコンテナ */
.progress-container {
    position: relative;
    width: 100%;
    max-width: 500px;
    height: 150px;
    background-color: #e3e797;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
}

#progressText {
    white-space: pre-line;
    line-height: 1.2;
}

/* 状態テキスト（背後に配置） */
.progress-text {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-size: 20px;
    font-weight: bold;
    font-style: italic;
    color: #ccc;
    letter-spacing: 0.5px;
    z-index: 4;
    user-select: none;
    width: 100%;
    text-align: center;
    white-space: nowrap;
    padding: 0 10px;
    box-sizing: border-box;
    opacity: 0.5;
}

/* 床 */
.progress-floor {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 35px;
    background: url('./img/pushtipF.png') repeat-x;
    background-size: auto 100%;
    z-index: 0;
}

/* キャラクターと荷物をまとめるコンテナ */
.progress-mover {
    position: absolute;
    bottom: 10px;
    left: 0;
    display: flex;
    align-items: flex-end;
    animation: moveRight 60s linear infinite;
    animation-play-state: paused;
    z-index: 2;
}

/* 女の子の歩行アニメーション */
.progress-girl {
    width: 120px;
    height: 140px;
    background: url('./img/pushtipA.png') no-repeat center/contain;
    animation: walkCycle 0.6s steps(1) infinite;
    animation-play-state: paused;
    z-index: 2;
}

/* 荷物 */
.progress-luggage {
    width: 100px;
    height: 100px;
    margin-right: -195px;
    background: url('./img/pushtipE.png') no-repeat center/contain;
    z-index: 1;
}

@keyframes moveRight {
    0% { transform: translateX(-100px); }
    100% { transform: translateX(600px); }
}

@keyframes moveRightMobile {
    0% { transform: translateX(-50px); }
    100% { transform: translateX(calc(100vw + 50px)); }
}

@keyframes walkCycle {
    0%   { background-image: url('./img/pushtipA.png'); }
    25%  { background-image: url('./img/pushtipB.png'); }
    50%  { background-image: url('./img/pushtipC.png'); }
    75%  { background-image: url('./img/pushtipD.png'); }
}
